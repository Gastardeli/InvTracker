<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InvTracker | DashBoard Diária</title>
    <link rel="stylesheet" href="styles/n3.css">
    <link rel="icon" href="assets/icon/icon.png" />
</head>

<body>


    <div class="container_main">
        <aside>
            <header>
                <img src="assets/imgs/logo.png" alt="" class="user">
                <div class="nome_user">
                    <p>InvTracker</p>
                </div>
            </header>
            <div class="body">

                <h2><b>Bem vindo, N3!</b></h2>

                <a href="dashboardEstoque.html">
                    <p class="click">Documentação</p>
                </a>
                <a href="dashboardCadastro.html">
                    <p class="click">Manual de Instalação</p>
                </a>
            </div>
            <div class="footer">
                <img src="assets/icon/iconUser.png" alt="">
                <div class="footerTexto"> User</div>
                <div class="logout">
                    <a href="index.html"><button>Sair</button></a>
                </div>
            </div>
        </aside>


        <div class="main" id="container">

            <h1>BobIA</h1>
            <textarea id="pergunta" type="text" placeholder="Digite a pergunta..."></textarea>

            <br><br>

            <button onclick="gerarResposta()">Gerar Resposta</button>
            <h3>Resposta da IA:</h3>

        <div id="resposta"></div>
    </div>

    
</body>
</html>

<script>
        
        async function gerarResposta() {
            const pergunta = document.getElementById('pergunta').value;

            const response = await fetch('/script/BobIA//perguntar', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ pergunta })
            });

            const data = await response.json();

            resposta.style.display = 'block';
            document.getElementById('resposta').innerText = data.resultado;
        }

    </script>
