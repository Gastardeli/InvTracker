<script>
    // Array para armazenar empresas cadastradas para validação de código de ativação
    let listaEmpresasCadastradas = [];
    var estoqueVar = Number(estoques.value);
    var loteVar = Number(lotes.value);
    var produtoVar = input_produto.value;
    var dataFabVar = input_dtFab.value;
    var dataValVar = input_dtValidade.value;
    var fabricanteVar = input_fabricante.value;
    var valorCompra = input_compraLote.value;
    var valorVenda = input_vendaLote.value;
    var idEmpresaVincular; // = store já logado

    function cadastrarProduto() {

        if (
            produtoVar == "" ||
            dataFabVar == "" ||
            dataValVar == "" ||
            fabricanteVar == "" ||
            valorCompraVar == "" ||
            valorVendaVar == ""
        ) {
            modal_cadastro.innerHTML =
                `<span style="color: red">Campos em branco, favor preencher.</span>`;
            modal_cadastro_grande.style.display = 'block';
            setInterval(sumirMensagem, 5000);

            return false;
        } else {
            setInterval(sumirMensagem, 5000);

            // Enviando o valor da nova input
            fetch("/usuarios/cadastrar", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                },
                body: JSON.stringify({
                    // crie um atributo que recebe o valor recuperado aqui
                    // Agora vá para o arquivo routes/usuario.js
                    estoqueServer: estoqueVar,
                    loteServer: loteVar,
                    produtoServer: produtoVar,
                    dataFabServer: dataFabVar,
                    dataValServer: dataValVar,
                    idEmpresaVincularServer: idEmpresaVincular,
                    fabricanteServer: fabricanteVar,
                    valorCompraServer: valorCompraVar,
                    valorVendaServer: valorVendaVar
                }),
            })
                .then(function (resposta) {
                    console.log("resposta: ", resposta);

                    if (resposta.ok && senhaForte > 3) {
                        modal_cadastro.innerHTML = `<span style="color:green">Registrado com Sucesso!</span>`;
                        modal_cadastro_grande.style.display = "block";

                        setTimeout(() => {
                            window.location.href = "login.html";
                        }, "5000");

                        limparFormulario();

                    } else {
                        throw "Houve um erro ao tentar realizar o cadastro!";
                    }
                })
                .catch(function (resposta) {
                    console.log(`#ERRO: ${resposta}`);

                });

            return false;
        }
    }
