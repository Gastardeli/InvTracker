<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InvTracker | Dashboard Estoque</title>
    <link rel="stylesheet" href="./css/styleDashboardEstoque.css" />
    <link rel="stylesheet" href="./css/style.css">
    <link rel="icon" href="assets/icon/icon.png" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.0.1"></script>
</head>
<style>
    #dashboard2{
        width: 100%;
        
    }
</style>
<body>


    <div class="container_main">
        <aside>
            <header>
                <img src="assets/imgs/logo.png" alt="" class="user">
                <div class="nome_user">
                    <p>InvTracker</p>
                </div>
            </header>
            <div class="body">
                <a href="dashboardDiaria.html">
                    <p id="click">DashBoard Diária</p>
                </a>
                <a href="#">
                    <p><b>DashBoard Estoque</b></p>
                </a>
                <a href="dashboardCadastro.html">
                    <p>Cadastrar Estoque</p>
                </a>
            </div>
            <div id="icon_help" class="iconHelpDiv">
                <a href="https://invtracker.atlassian.net/servicedesk/customer/portals"><span>Central de
                        Atendimento</span></a>
            </div>
            <div class="footer">
                <img src="assets/icon/iconUser.png" alt="">
                <div class="footerTexto"> Olá! User</div>
                <div class="logout">
                    <a href="index.html"><button>Sair</button></a>
                </div>
            </div>

        </aside>
        <div class="container_direita2">
            <div id="dashboard_estoque">
                <div class="select_esquerda">
                    <div class="kpi">
                        <div class="titulo">
                            <p>Selecione seu estoque</p>
                            <select>
                                <option value="estoque1">Estoque 1</option>
                                <option value="#" disabled>Selecione uma Opção</option>
                            </select>
                        </div>
                    </div>
                    <div class="kpi">
                        <p class="titulo">Lote com maior necessidade de reposição
                            <span style="color: red">Lote 05</span>
                        </p>
                    </div>
                    <div class="kpi">
                        <p class="titulo">Quantos Lotes precisam de reabastecimento
                            <span style="color: red">2</span>
                        </p>
                    </div>
                </div>
                <div class="dash_direita">
                    <canvas id="dashboard1"></canvas>
                    <canvas id="dashboard2"></canvas>
                </div>
            </div>
        </div>

        <script src="script/scriptDashboardEstoque.js"></script>
</body>


</html>

<script>

    // Função para obter e plotar o gráfico 1: produtos com <20% ocupado
    function obterDadosGrafico1() {
        fetch('/dashEstoque/graficoDoisEstadoCritico', { cache: 'no-store' })
            .then(response => {
                if (!response.ok) throw new Error('Erro ao carregar dados');
                return response.json();
            })
            .then(data => {
                const arrayProdutos = data.graficoPersonagens;

                console.log("Dados para gráfico 1 (críticos):", arrayProdutos);

                // Plotar gráfico 1
                plotarGrafico(arrayProdutos, 1);
            })
            .catch(error => {
                console.error("Erro na obtenção dos dados p/ gráfico 1:", error.message);
            });
    }

    // Função para obter e plotar o gráfico 2: todos os lotes por ocupação
    function obterDadosGrafico2() {
        fetch('/dashEstoque/graficoOcupacaoLotes', { cache: 'no-store' })
            .then(response => {
                if (!response.ok) throw new Error('Erro ao carregar dados');
                return response.json();
            })
            .then(data => {
                const arrayProdutos = data.graficoPersonagens;

                console.log("Dados para gráfico 2 (ocupação):", arrayProdutos);

                // Plotar gráfico 2
                plotarGrafico(arrayProdutos, 2);
            })
            .catch(error => {
                console.error("Erro na obtenção dos dados p/ gráfico 2:", error.message);
            });
    }





    function plotarGrafico(resposta, idItem) {
        console.log('iniciando plotagem do gráfico...');

        let labels = [];
        let dados = {
            labels: labels,
            datasets: [{
                label: idItem === 1 ? 'Percentual Ocupado (Crítico)' : 'Percentual de ocupação',
                data: [],
                fill: false,
                borderColor: idItem === 1 ? 'red' : 'blue',
                tension: 0.1,
                borderWidth: 5
            }]
        };

        // Adicionar dados ao gráfico
        for (let i = 0; i < resposta.length; i++) {
            const registro = resposta[i];
            labels.push(registro.nomeProduto); // ou "idLote" se preferir
            dados.datasets[0].data.push(registro.percentualOcupado);
        }

        const config = {
            type: 'bar',
            data: dados,
            options: {
                plugins: {
                    legend: {
                        labels: {
                            color: '#000000',
                            font: {
                                size: 14
                            }
                        }
                    }
                },
                scales: {
                    y: {
                        title: {
                            display: true,
                            color: '#000000',
                            font: {
                                size: 16
                            }
                        },
                        ticks: {
                            color: '#000000',
                            font: {
                                size: 16
                            },
                            callback: function (value) {
                                if (value % 1 === 0) return value;
                            }
                        },
                        grid: {
                            color: 'rgba(0, 0, 0, 0.1)'
                        }
                    },
                    x: {
                        title: {
                            display: true,
                            text: idItem === 1 ? 'Produtos em Estado Crítico' : 'Produtos por Ocupação',
                            color: '#000000',
                            font: {
                                size: 16
                            }
                        },
                        ticks: {
                            color: '#000000',
                            font: {
                                size: 20
                            }
                        },
                        grid: {
                            color: 'rgba(0, 0, 0, 0.1)'
                        }
                    }
                }
            }
        };

        // Criar o gráfico no canvas correspondente
        let myChart = new Chart(
            document.getElementById(`dashboard${idItem}`),
            config
        );

        // Atualizar periodicamente (opcional)
        setTimeout(() => atualizarGrafico(idItem, dados, myChart), 2000);
    }


    function atualizarGrafico(idItem, dados, myChart) {
        const url = `/graficos/grafico-${idItem === 1 ? 'dois-estados-critico' : 'ocupacao-lotes'}`;

        fetch(url, { cache: 'no-store' })
            .then(response => {
                if (!response.ok) throw new Error('Erro ao carregar dados');
                return response.json();
            })
            .then(data => {
                const arrayProdutos = data.graficoPersonagens;

                if (arrayProdutos.length === 0) {
                    console.warn("Array de produtos vazio, não é possível atualizar o gráfico.");
                    proximaAtualizacao = setTimeout(() => atualizarGrafico(idItem, dados, myChart), 2000);
                    return;
                }

                const novoRegistro = arrayProdutos[arrayProdutos.length - 1];

                // Verificar se o último dado é diferente do atual
                if (novoRegistro.nomeProduto !== dados.labels[dados.labels.length - 1]) {
                    // Atualizar o gráfico
                    dados.labels.shift();
                    dados.labels.push(novoRegistro.nomeProduto);

                    dados.datasets[0].data.shift();
                    dados.datasets[0].data.push(novoRegistro.percentualOcupado);

                    myChart.update();
                }

                proximaAtualizacao = setTimeout(() => atualizarGrafico(idItem, dados, myChart), 2000);
            })
            .catch(error => {
                console.error("Erro na obtenção dos dados p/ gráfico:", error.message);
                proximaAtualizacao = setTimeout(() => atualizarGrafico(idItem, dados, myChart), 2000);
            });
    }

    document.addEventListener("DOMContentLoaded", function () {
        obterDadosGrafico1();
        obterDadosGrafico2();
    });








</script>
