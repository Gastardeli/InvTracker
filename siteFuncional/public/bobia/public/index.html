<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InvTracker | Suporte</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="././icon/icon.png" />
</head>

<body>

    <div class="container_main">
        <aside>
            <header>
                <div class="nome_user">
                    <img src="././icon/icon.png" alt="icon">
                    <p>InvTracker</p>
                </div>
            </header>
            <div class="body">

                <img src="./icon/iconUser.png" alt="iconUser">
                <h2><b style="color: #fff;">Bem vindo, N3!</b></h2>

                <a href="./documentacao/TI-Documentacao-InvTracker-Grupo1.docx" target="iframe_download">
                    <p class="click">Documentação</p>
                </a>
                <a href="./documentacao/Manual de Instalação InvTracker.pdf" target="iframe_download">
                    <p class="click">Manual de Instalação</p>
                </a>
                <a href="./documentacao/Fluxograma.pdf" target="iframe_download">
                    <p class="click">Fluxograma</p>
                </a>
            </div>
            <div class="footer">
                <a href="http://localhost:3333"><button>Sair</button></a>
            </div>
        </aside>


        <div class="main" id="container">

            <h1>BobIA</h1>
            <textarea class="bobIaInput" id="pergunta" type="text" placeholder="Digite a pergunta..."></textarea>

            <br><br>

            <button onclick="gerarResposta()">Gerar Resposta</button>
            <h3>Resposta da IA:</h3>

            <div id="resposta" class="campo_resposta"></div>
        </div>


</body>

</html>

<script>
    async function gerarResposta() {
        const pergunta = document.getElementById('pergunta').value;

        const response = await fetch('/perguntar', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ pergunta })
        });

        const data = await response.json();

        resposta.style.display = 'block';
        document.getElementById('resposta').innerText = data.resultado;
    }

</script>
