<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InvTracker | DashBoard Diária</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/styleDashboardEstoque.css" />
    <link rel="icon" href="assets/icon/icon.png" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.0.1"></script>
</head>

<body>


    <div class="container_main">
        <aside>
            <header>
                <img src="assets/imgs/logo.png" alt="" class="user">
                <div class="nome_user">
                    <p>InvTracker</p>
                </div>
            </header>
            <div class="body">
                <a href="#">
                    <p id="click"><b>DashBoard Diária</b></p>
                </a>
                <a href="dashboardEstoque.html">
                    <p>DashBoard Estoque</p>
                </a>
                <a href="dashboardCadastro.html">
                    <p>Atualizar Produtos</p>
                </a>

            </div>
            <div id="icon_help" class="iconHelpDiv">
                <a href="https://invtracker.atlassian.net/servicedesk/customer/portals"><span>Central de
                        Atendimento</span></a>
            </div>

            <div class="footer">
                <img src="assets/icon/iconUser.png" alt="">
                <div class="footerTexto"><span id="nomeUsuario"></span></div>
                <div class="logout">
                    <a href="index.html"><button>Sair</button></a>
                </div>
            </div>
        </aside>
        <div class="container_direita2">
            <div id="dashboard_estoque">
                <div class="select_esquerda">
                    <div class="kpi">
                        <p class="titulo">Lotes para reabastecer <br>
                            <span style="color: red" id="kpi1">
                        </p>
                        </span>
                    </div>
                    <div class="kpi">
                        <p class="titulo">Produto mais perto do vencimento
                            <span id="kpi3">
                            </span>
                        </p>
                    </div> <br>
                    <button class="botaoDeletar" onclick="deletarRegistrar()">Deletar Registro mais antigo</button>
                </div>
                <div class="dash_direita">
                    <canvas id="dashboard2"></canvas>
                    <canvas id="dashboard1"></canvas>

                </div>
            </div>
        </div>
</body>


</html>

<script src="js/dashDiariajs.js"></script>
<Script>
    const nomeUser = document.getElementById("nomeUsuario");
    nomeUser.innerHTML = `Olá! ${sessionStorage.NOME_USUARIO}`

    const kpi1 = document.getElementById("kpi1");

    fetch(`/dashDiaria/kpiQtdLotesReposicao/${sessionStorage.ID_EMPRESA}`)
        .then(resposta => resposta.json())
        .then(produto => {
            var mensagem = ``;

            if (produto.length > 1) {
                for (var index = 0; index < produto.length; index++) {
                    var atual = produto[index];
                    var atualEstoque = atual.fkEstoque;
                    var atualLote = atual.idLote;
                    var atualProduto = atual.fkProduto;
                    var atualEstoqueNome = atual.estoqueNome;

                    mensagem += `Estoque ${atualEstoque} - Lote ${atualLote} <br>`

                }
            }

            kpi1.innerHTML = mensagem;
        })
        .catch(erro => {
            console.error('Erro na requisição:', erro);
        });


    const kpi3 = document.getElementById("kpi3");

    fetch(`/dashDiaria/kpiProdutoVencido/${sessionStorage.ID_EMPRESA}`)
        .then(resposta => resposta.json())
        .then(produto => {
            console.log(produto);
            if (produto.length == 0) {
                kpi3.innerHTML = `Não há nenhum produto cadastrado.`
            }
            var data = produto[0].dtValidade;
            var dataConvertida = new Date(data);
            var venceu = produto[0].diasParaVencer
            var dataFormatada = dataConvertida.toLocaleDateString('pt-BR', { timeZone: 'UTC' });

            if (venceu == 'Vencido') {
                venceu = `<span style="color: red; font-weight: bold">${produto[0].diasParaVencer}!</span>`
            } else {
                venceu = `<span style="color: blue; font-weight: bold">Faltam ${produto[0].diasParaVencer} dias para vencer</span>`
            }

            kpi3.innerHTML = `${produto[0].nomeProduto} <br> Validade ${dataFormatada} <br> Estoque: ${produto[0].idEstoque} <br> Lote: ${produto[0].idLote} <br> ${venceu}`


        })
        .catch(erro => {
            console.error('Erro na requisição:', erro);
        });

    function deletarRegistrar() {
        fetch(`/dashDiaria/deletarRegistro/${sessionStorage.ID_EMPRESA}`, {
            method: "PUT",
            headers: {
                "Content-Type": "application/json",
            },
        })
            .then(function (resposta) {
                setTimeout(function () {
                    kpi3.innerHTML =
                        `<span style="color:#E67C1C">Atualizando Produtos...</span>`;
                    setTimeout(() => {
                        window.location.reload()
                    }, "5000");
                }, 1000);

                if (!resposta.ok) {

                    throw new Error('Erro na requisição: ' + resposta.statusText);
                }
            })
    }


</Script>
