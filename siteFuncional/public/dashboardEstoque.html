<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InvTracker | Dashboard Estoque</title>
    <link rel="stylesheet" href="./css/styleDashboardEstoque.css" />
    <link rel="stylesheet" href="./css/style.css">
    <link rel="icon" href="assets/icon/icon.png" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.0.1"></script>

    <script src="js/dashEstoquejs.js"></script>

</head>

<body>


    <div class="container_main">
        <aside>
            <header>
                <img src="assets/imgs/logo.png" alt="" class="user">
                <div class="nome_user">
                    <p>InvTracker</p>
                </div>
            </header>
            <div class="body">
                <a href="dashboardDiaria.html">
                    <p>DashBoard Diária</p>
                </a>
                <a href="#">
                    <p id="click"><b>DashBoard Estoque</b></p>
                </a>
                <a href="dashboardCadastro.html">
                    <p>Atualizar Produtos</p>
                </a>
            </div>
            <div id="icon_help" class="iconHelpDiv">
                <a href="https://invtracker.atlassian.net/servicedesk/customer/portals"><span>Central de
                        Atendimento</span></a>
            </div>
            <div class="footer">
                <img src="assets/icon/iconUser.png" alt="">
                <div class="footerTexto"><span id="nomeUsuario"></span></div>
                <div class="logout">
                    <a href="index.html"><button>Sair</button></a>
                </div>
            </div>

        </aside>

        <div class="container_direita2">
            <div id="dashboard_estoque">
                <div class="select_esquerda">
                    <div id="kpiMostrar1" class="kpi" style="display: none;">
                        <p class="titulo">Lote com maior necessidade de reposição
                            <span style="color: red" id="kpi1"></span>
                        </p>
                    </div>
                    <div id="kpiMostrar2" class="kpi" style="display: none;">
                        <p class=" titulo">Quantos Lotes precisam de reabastecimento
                            <span style="color: red" id="kpi2"></span>
                        </p>
                    </div>
                    <button id="selectVoltar" style="display: none" onclick="location.reload()">Selecionar outro
                        Estoque</button>
                </div>
                <div class="dash_direita">
                    <canvas id="dashboard1"></canvas>
                    <canvas id="dashboard2"></canvas>
                </div>
            </div>
        </div>

        <div class="modalKpi0" id="modalGrande">
            <div class="kpi" id="kpi0">
                <div class="titulo">
                    <p>Selecione seu estoque</p>
                    <select id="selectEstoque" onchange="atualizarGraficos()">
                        <option value="#" disabled selected>Selecione uma Opção</option>
                        <option value="1">Estoque 1</option>
                        <option value="2">Estoque 2</option>
                    </select>
                </div>
            </div>
        </div>
</body>


</html>

<script>
    const nomeUser = document.getElementById("nomeUsuario");
    nomeUser.innerHTML = `Olá! ${sessionStorage.NOME_USUARIO}`

    function redirectEstoque() {
        dashboard_diaria.style.display = "none";
        dashboard_estoque.style.display = "block";
    }

    function redirectDiaria() {
        dashboard_diaria.style.display = "block";
        dashboard_estoque.style.display = "none";
    }

    const kpi1 = document.getElementById("kpi1");

    fetch(`/dashEstoque/loteComMaiorNecessidade/${sessionStorage.ID_EMPRESA}`)
        .then(resposta => resposta.json())
        .then(produto => {
            console.log(produto);
            var mensagem = ``;

            /*COLOCAR KPI*/

            kpi1 = mensagem;
        })
        .catch(erro => {
            console.error('Erro na requisição:', erro);
        });

    const kpi2 = document.getElementById("kpi2");

    fetch(`/dashEstoque/qtdeLotesReabastecimento/${sessionStorage.ID_EMPRESA}`)
        .then(resposta => resposta.json())
        .then(produto => {
            console.log(produto);
            var mensagem = ``;

            /*COLOCAR KPI*/

            kpi2 = mensagem;
        })
        .catch(erro => {
            console.error('Erro na requisição:', erro);
        });
</script>
